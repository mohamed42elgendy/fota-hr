<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b45309" />
  <title>Fotat HR - مصنع فتات للمخبوزات</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fotat HR" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">
        <div class="brand-logo">ف</div>
        <div>
          <div class="brand-title" data-i18n="factoryName">مصنع فتات للمخبوزات</div>
          <div class="brand-sub" data-i18n="loginSubtitle">نظام إدارة الموارد البشرية والحضور والرواتب</div>
        </div>
      </div>

      <div class="designer-signature-pill" data-i18n="designerBadge">
        تصميم وتطوير: مستر محمد الجندي — مدير تشغيل إقليمي
      </div>

      <div class="form-group">
        <label data-i18n="language">اللغة</label>
        <select id="loginLangSelect"></select>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label data-i18n="username">اسم المستخدم</label>
          <input type="text" id="loginUsername" required placeholder="ادخل اسم المستخدم الخاص بك" />
        </div>
        <div class="form-group">
          <label data-i18n="pin">الرمز السري (PIN)</label>
          <input type="password" id="loginPin" required placeholder="****" />
        </div>
        <div id="loginError" class="hidden" style="color:#dc2626;font-size:0.85rem;margin-bottom:10px;font-weight:700;"></div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="loginBtn">دخول</button>
      </form>
    </div>
  </section>

  <!-- MAIN APP SHELL -->
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand-mark">
        <div class="brand-logo">ف</div>
        <div>
          <div class="brand-title" data-i18n="appTitle">فتات للموارد البشرية</div>
          <div class="brand-sub" data-i18n="factoryName">مصنع فتات للمخبوزات</div>
        </div>
      </div>

      <nav id="navList" class="nav-list"></nav>

      <div class="sidebar-footer">
        <span data-i18n="designerBadge">تصميم وتطوير: مستر محمد الجندي — مدير تشغيل إقليمي</span>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuToggle" class="menu-toggle" type="button">☰</button>
          <div class="user-pill">
            <span id="currentUserName"></span>
            <span id="currentUserRole" class="role-tag"></span>
          </div>
        </div>
        <div class="topbar-right">
          <button id="installAppBtn" class="btn btn-outline btn-sm" type="button" data-i18n="installApp">📲 تثبيت التطبيق</button>
          <select id="appLangSelect" style="width:auto;padding:6px 10px;font-size:0.85rem;"></select>
          <button id="logoutBtn" class="btn btn-outline btn-sm" type="button" data-i18n="logout">تسجيل خروج</button>
        </div>
      </header>

      <main id="mainContent" class="content"></main>

      <footer class="app-footer no-print">
        <span data-i18n="factoryName">مصنع فتات للمخبوزات</span>
        <span data-i18n="designerBadge">تصميم وتطوير: مستر محمد الجندي — مدير تشغيل إقليمي</span>
      </footer>
    </div>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalBox" class="modal"></div>
  </div>

  <script src="./js/i18n.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/payroll.js"></script>
  <script src="./js/ocr.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
